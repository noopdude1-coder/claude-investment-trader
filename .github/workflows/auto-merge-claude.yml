name: Auto-merge claude bot branches

# Why this exists: Claude Code Cloud routines push to claude/* feature branches
# and don't open PRs (the "Create PR" button is a manual user action). For an
# autonomous bot whose memory IS the main branch, every routine's work must
# land on main within seconds or the next routine reads stale state. This
# workflow squash-merges any push to a claude/* branch directly into main and
# deletes the branch.

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Squash-merge bot branch into main
        env:
          BOT_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git fetch origin "$BOT_BRANCH"

          # Use the bot's most recent commit message as the squash commit message
          # so main's history reads naturally (e.g. "pre-market research 2026-04-27").
          SQUASH_MSG=$(git log -1 --pretty=%s "origin/$BOT_BRANCH")

          if ! git merge --squash "origin/$BOT_BRANCH"; then
            echo "Merge conflict on $BOT_BRANCH — leaving branch open for manual review."
            exit 1
          fi

          # If squash had no effect (already merged, etc.), exit cleanly.
          if git diff --cached --quiet; then
            echo "No changes to merge from $BOT_BRANCH (already on main)."
            git push origin --delete "$BOT_BRANCH" || true
            exit 0
          fi

          git commit -m "$SQUASH_MSG"
          git push origin main
          git push origin --delete "$BOT_BRANCH"
